schema_version: "1.1"
name: pos-dt-binding-adc
description: 'Should trigger. New devicetree binding schema for an SPI ADC.'
tags: [trigger, should-trigger, train]
execution:
  model: sonnet
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: 'Write a DT binding YAML for an SPI ADC, compatible "acme,adc8": two supplies (avdd, vref), optional reset-gpios, one interrupt. It has to pass dt_binding_check and I''d like an example node too.'
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?kernel-development-skills"'
