schema_version: "1.1"
name: neg-rust-libusb-crate
description: 'Near miss, should not trigger. Rust crate wrapping libusb.'
tags: [trigger, should-not-trigger, train]
execution:
  model: sonnet
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: 'I''m publishing a Rust crate that wraps libusb (rusb) for a USB HID gadget we sell. How should I structure the error types, and should the public API be async?'
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?kernel-development-skills"'
    min: 0
    max: 0
    arm: both
